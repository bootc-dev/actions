name: Test published actions
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-bootc-host-setup:
    name: Test bootc-host-setup@main
    runs-on: ubuntu-24.04
    steps:
      - name: Run bootc-host-setup
        uses: bootc-dev/actions/bootc-host-setup@main

      - name: Verify setup
        run: |
          just --version
          test -n "$ARCH"

      - name: Verify basic requirements
        uses: bootc-dev/actions/.github/actions/verify-basic-requirements@main

  test-bootc-host-setup-2604:
    name: Test bootc-host-setup@main (26.04)
    runs-on: ubuntu-26.04
    steps:
      - name: Run bootc-host-setup
        uses: bootc-dev/actions/bootc-host-setup@main

      - name: Verify setup
        run: |
          just --version
          test -n "$ARCH"

      - name: Verify basic requirements
        uses: bootc-dev/actions/.github/actions/verify-basic-requirements@main

  test-setup-rust:
    name: Test setup-rust@main
    runs-on: ubuntu-latest
    steps:
      - name: Run setup-rust
        uses: bootc-dev/actions/setup-rust@main

      - name: Verify setup
        run: |
          rustc --version
          cargo --version
          cargo nextest --version

  test-openssf-scorecard:
    name: Test openssf-scorecard@main
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run openssf-scorecard
        uses: bootc-dev/actions/openssf-scorecard@main
        with:
          base-sha: ${{ github.event.before }}
          head-sha: ${{ github.sha }}

  test-required-checks:
    name: Test required-checks@main
    runs-on: ubuntu-slim
    if: always()
    needs: [test-setup-rust, test-bootc-host-setup]
    steps:
      - name: Run required-checks (needed jobs succeeded)
        uses: bootc-dev/actions/required-checks@main
        with:
          needs: ${{ toJson(needs) }}

      - name: Run required-checks (needed job failed)
        id: failed
        continue-on-error: true
        uses: bootc-dev/actions/required-checks@main
        with:
          needs: '{"test-job":{"result":"failure","outputs":{}}}'

      - name: Run required-checks (needed job skipped)
        id: skipped
        continue-on-error: true
        uses: bootc-dev/actions/required-checks@main
        with:
          needs: '{"test-job":{"result":"skipped","outputs":{}}}'

      - name: Run required-checks (no needed jobs)
        id: empty
        continue-on-error: true
        uses: bootc-dev/actions/required-checks@main
        with:
          needs: '{}'

      - name: Verify outcomes
        run: |
          test "${{ steps.failed.outcome }}" = "failure"
          test "${{ steps.skipped.outcome }}" = "success"
          test "${{ steps.empty.outcome }}" = "failure"
